<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema World</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Cinema World</h1>

        <nav>
            <a href="#">خانه</a>
            <a href="#">فیلم‌ها</a>
            <a href="#">درباره ما</a>
            <a href="#">تماس با ما</a>
        </nav>
    </header>

    <section class="hero">
        <h2>دنیای سینما</h2>
        <p>به دنیای شگفت‌انگیز فیلم‌ها خوش آمدید.</p>
        <button>مشاهده فیلم‌ها</button>
    </section>

    <main>
        <h2 class="section-title">فیلم‌های پیشنهادی</h2>

        <div class="movies">

            <div class="movie-card">
                <img src="https://placehold.co/300x400" alt="Movie">
                <h3>Interstellar</h3>
                <p>ژانر: علمی تخیلی</p>
                <span>امتیاز: 8.7</span>
            </div>

            <div class="movie-card">
                <img src="https://placehold.co/300x400" alt="Movie">
                <h3>Inception</h3>
                <p>ژانر: معمایی</p>
                <span>امتیاز: 8.8</span>
            </div>

            <div class="movie-card">
                <img src="https://placehold.co/300x400" alt="Movie">
                <h3>The Batman</h3>
                <p>ژانر: جنایی</p>
                <span>امتیاز: 7.8</span>
            </div>

        </div>
    </main>

    <footer>
        <p>© 2026 Cinema World - All Rights Reserved</p>
    </footer>

</body>
</html>
